<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Le week-end du Sèvres F.C. 92</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout : bandeau marine du club avec le week-end, menu de rubriques collant, affiches story 9:16 en grille, visionneuse plein écran */
:root{
  --marine:#1B2A4A; --orange:#E0592A; --bg:#F5F3EE; --card:#FFFFFF; --fg:#1B2A4A; --muted:#5D6880; --line:#DAD6CC; --chip:#EAE6DC; --onmarine:#C9D2E6; --veil:rgba(10,16,30,.92);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1729;--card:#18233B;--fg:#E8ECF4;--muted:#A3AEC4;--line:#2A3754;--chip:#22304D;--orange:#F07A4E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1729;--card:#18233B;--fg:#E8ECF4;--muted:#A3AEC4;--line:#2A3754;--chip:#22304D;--orange:#F07A4E;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--marine);color:#fff}
header .wrap{display:flex;flex-direction:column;gap:16px;padding-block:20px 18px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:60px;height:60px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;flex:none}
.brand p{margin:0;color:var(--onmarine);font-size:.95rem}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:.01em;margin:0;line-height:1;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:var(--orange)}
.weeks{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.weeks button{flex:none;font:600 .98rem var(--body);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:7px 14px;cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--orange);border-color:var(--orange)}
.weeks .now{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;margin-left:6px;opacity:.85}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--orange)}
nav a .n{font-family:var(--body);font-weight:600;font-size:.75rem;margin-left:5px;opacity:.7}
button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
main .wrap{padding-block:22px 40px;display:flex;flex-direction:column;gap:30px}
section{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:700;font-size:1.55rem;margin:0;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
@media (max-width:460px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figure button{display:block;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);cursor:zoom-in;width:100%}
figure img{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:cover;max-width:100%}
figcaption{font-weight:600;font-size:.95rem;line-height:1.3}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted)}
.alert{background:var(--orange);color:#fff;border-radius:10px;padding:12px 16px;font-weight:600}
footer{color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
footer .wrap{padding-block:16px 28px}
#lb{position:fixed;inset:0;z-index:20;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#lb[hidden]{display:none}
#lb img{max-height:calc(100% - 64px);max-width:100%;width:auto;aspect-ratio:9/16;border-radius:8px;object-fit:contain}
#lb .bar{display:flex;align-items:center;gap:10px;color:#fff;max-width:100%}
#lb .bar span{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb button,#lb a{flex:none;font:600 .95rem var(--body);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 14px;cursor:pointer;text-decoration:none}
@media (prefers-reduced-motion:no-preference){figure button img{transition:transform .2s}figure button:hover img{transform:scale(1.02)}}
</style>
</head><body>


<header><div class="wrap">
  <div class="brand">
    <img src="logo.png" alt="Logo Sèvres F.C. 92">
    <div><h1>Le week-end <em>du Sèvres F.C. 92</em></h1><p>Tous les matchs du club, à domicile et à l'extérieur</p></div>
  </div>
  <div class="weeks" id="weeks" role="group" aria-label="Choisir le week-end"></div>
</div></header>

<nav aria-label="Rubriques"><div class="wrap" id="nav"></div></nav>

<main><div class="wrap" id="content"></div></main>

<footer><div class="wrap">Touchez une affiche pour l'agrandir. Sur téléphone, un appui long sur l'affiche agrandie permet de l'enregistrer et de la partager en story.</div></footer>

<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Affiche agrandie">
  <img id="lb-img" alt="">
  <div class="bar">
    <button type="button" id="lb-prev" aria-label="Affiche précédente">‹</button>
    <span id="lb-cap"></span>
    <button type="button" id="lb-next" aria-label="Affiche suivante">›</button>
    <a id="lb-open" href="#" target="_blank" rel="noopener">Ouvrir</a>
    <button type="button" id="lb-close">Fermer</button>
  </div>
</div>

<script>
const WEEKS=[{"id":"2026-10-17","lab":"17 – 18 oct.","fin":"2026-10-18","tous":[["Samedi 17","img/2026-10-17-tous-samedi.jpg"],["Dimanche 18 et lundi 19","img/2026-10-17-tous-dimanche-lundi.jpg"]],"stades":[["fontaines","Samedi 17","img/2026-10-17-fontaines-samedi.jpg"],["fontaines","Dimanche 18","img/2026-10-17-fontaines-dimanche.jpg"]],"cat":[["U12 et U13","img/2026-10-17-u12-u13.jpg"],["Féminines","img/2026-10-17-feminines.jpg"],["U14, U15 et U16","img/2026-10-17-u14-u15-u16.jpg"],["U18","img/2026-10-17-u18.jpg"],["Séniors et U20","img/2026-10-17-seniors-u20.jpg"],["Vétérans","img/2026-10-17-veterans.jpg"],["Foot loisirs","img/2026-10-17-foot-loisirs.jpg"]],"amical":[]},{"id":"2026-10-31","lab":"31 oct. – 2 nov.","fin":"2026-11-02","tous":[["Samedi 31","img/2026-10-31-tous-samedi.jpg"],["Dimanche 1er et lundi 2","img/2026-10-31-tous-dimanche-lundi.jpg"]],"stades":[["fontaines","Samedi 31","img/2026-10-31-fontaines-samedi.jpg"],["fontaines","Dimanche 1er et lundi 2","img/2026-10-31-fontaines-dimanche-lundi.jpg"],["marcel-bec","Lundi 2","img/2026-10-31-marcel-bec-lundi.jpg"]],"cat":[["Féminines","img/2026-10-31-feminines.jpg"],["U18","img/2026-10-31-u18.jpg"],["Séniors et U20","img/2026-10-31-seniors-u20.jpg"],["U15 et U16","img/2026-10-31-u15-u16.jpg"],["Vétérans","img/2026-10-31-veterans.jpg"],["Foot loisirs","img/2026-10-31-foot-loisirs.jpg"]],"amical":[["Match amical à trouver","img/2026-10-31-match-amical-a-trouver.jpg"]]},{"id":"2026-11-07","lab":"7 – 9 nov.","fin":"2026-11-09","tous":[["Samedi matin","img/2026-11-07-samedi-matin.jpg"],["Samedi midi","img/2026-11-07-samedi-midi.jpg"],["Samedi après-midi","img/2026-11-07-samedi-apres-midi.jpg"],["Dimanche 8 et lundi 9","img/2026-11-07-dimanche-lundi.jpg"]],"stades":[["fontaines","Samedi 7","img/2026-11-07-fontaines-samedi.jpg"],["wagner","Samedi 7","img/2026-11-07-wagner-samedi.jpg"],["fontaines","Dimanche 8 et lundi 9","img/2026-11-07-fontaines-dimanche-lundi.jpg"],["wagner","Dimanche 8","img/2026-11-07-wagner-dimanche.jpg"]],"cat":[["U10 et U11","img/2026-11-07-u10-u11.jpg"],["U12 et U13","img/2026-11-07-u12-u13.jpg"],["Féminines","img/2026-11-07-feminines.jpg"],["U14, U15 et U16","img/2026-11-07-u14-u15-u16.jpg"],["U18","img/2026-11-07-u18.jpg"],["Séniors et U20","img/2026-11-07-seniors-u20.jpg"],["Vétérans","img/2026-11-07-veterans.jpg"],["Foot loisirs","img/2026-11-07-foot-loisirs.jpg"],["Séances du week-end","img/2026-11-07-entrainements-seances.jpg"]],"amical":[["Match amical à trouver","img/2026-11-07-match-amical-a-trouver.jpg"]]},{"id":"2026-11-14","lab":"14 – 16 nov.","fin":"2026-11-16","tous":[["Samedi matin","img/2026-11-14-samedi-matin.jpg"],["Samedi midi","img/2026-11-14-samedi-midi.jpg"],["Samedi après-midi","img/2026-11-14-samedi-apres-midi.jpg"],["Dimanche 15 et lundi 16","img/2026-11-14-dimanche-lundi.jpg"]],"stades":[["fontaines","Samedi 14","img/2026-11-14-fontaines-samedi.jpg"],["wagner","Samedi 14","img/2026-11-14-wagner-samedi.jpg"],["fontaines","Dimanche 15 et lundi 16","img/2026-11-14-fontaines-dimanche-lundi.jpg"],["wagner","Dimanche 15","img/2026-11-14-wagner-dimanche.jpg"],["marcel-bec","Lundi 16","img/2026-11-14-marcel-bec-lundi.jpg"]],"cat":[["U10 et U11","img/2026-11-14-u10-u11.jpg"],["U12 et U13","img/2026-11-14-u12-u13.jpg"],["Féminines","img/2026-11-14-feminines.jpg"],["U14, U15 et U16","img/2026-11-14-u14-u15-u16.jpg"],["U18","img/2026-11-14-u18.jpg"],["Séniors et U20","img/2026-11-14-seniors-u20.jpg"],["Vétérans","img/2026-11-14-veterans.jpg"],["Foot loisirs","img/2026-11-14-foot-loisirs.jpg"],["Séances du week-end","img/2026-11-14-entrainements-seances.jpg"]],"amical":[["Match amical à trouver","img/2026-11-14-match-amical-a-trouver.jpg"]]},{"id":"2026-11-21","lab":"21 – 23 nov.","fin":"2026-11-23","tous":[["Samedi 21","img/2026-11-21-samedi.jpg"],["Dimanche 22 et lundi 23","img/2026-11-21-dimanche-lundi.jpg"]],"stades":[["fontaines","Samedi 21","img/2026-11-21-fontaines-samedi.jpg"],["wagner","Samedi 21","img/2026-11-21-wagner-samedi.jpg"],["fontaines","Dimanche 22 et lundi 23","img/2026-11-21-fontaines-dimanche-lundi.jpg"],["wagner","Dimanche 22","img/2026-11-21-wagner-dimanche.jpg"],["marcel-bec","Dimanche 22","img/2026-11-21-marcel-bec-dimanche.jpg"]],"cat":[["U10 et U11","img/2026-11-21-u10-u11.jpg"],["U12 et U13","img/2026-11-21-u12-u13.jpg"],["Féminines","img/2026-11-21-feminines.jpg"],["U14, U15 et U16","img/2026-11-21-u14-u15-u16.jpg"],["U18","img/2026-11-21-u18.jpg"],["Séniors et U20","img/2026-11-21-seniors-u20.jpg"],["Vétérans","img/2026-11-21-veterans.jpg"],["Foot loisirs","img/2026-11-21-foot-loisirs.jpg"],["Séances du week-end","img/2026-11-21-entrainements-seances.jpg"]],"amical":[["Match amical à trouver","img/2026-11-21-match-amical-a-trouver.jpg"]]}];
const STADES={fontaines:['Stade des Fontaines','Sèvres'],wagner:['Stade Jean Wagner','Sèvres'],'marcel-bec':['Stade Marcel Bec','Meudon']};
const VIEWS=[['tous','Tous les matchs'],['stades','Par stade'],['categories','Par catégorie'],['amical','Match amical']];
const today=new Date().toISOString().slice(0,10);
const cur=(WEEKS.find(w=>w.fin>=today)||WEEKS[WEEKS.length-1]).id;
let week=cur, list=[], idx=0;
const view=()=>{const h=location.hash.slice(1);return VIEWS.some(v=>v[0]===h)?h:'tous';};
const W=()=>WEEKS.find(w=>w.id===week);
const count=(w,v)=>({tous:w.tous,stades:w.stades,categories:w.cat,amical:w.amical})[v].length;
const fig=(cap,src)=>{list.push([cap,src]);const i=list.length-1;
  return `<figure><button type="button" data-i="${i}" aria-label="Agrandir : ${cap}"><img src="${src}" alt="Affiche ${cap}, week-end du ${W().lab}" loading="lazy"></button><figcaption>${cap}</figcaption></figure>`;};
const empty=t=>`<div class="empty">${t}</div>`;
function sec(title,sub,items){return `<section><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${items}</section>`;}
function render(){
  const w=W(), v=view(); list=[];
  document.getElementById('weeks').innerHTML=[...WEEKS].reverse().map(x=>`<button type="button" id="w-${x.id}" data-w="${x.id}" aria-pressed="${x.id===week}">${x.lab}${x.id===cur?'<span class="now">ce week-end</span>':''}</button>`).join('');
  document.getElementById('nav').innerHTML=VIEWS.map(([id,l])=>`<a href="#${id}" ${id===v?'aria-current="page"':''}>${l}<span class="n">${count(w,id)}</span></a>`).join('');
  let h='';
  if(v==='tous') h=sec('Tous les matchs','Week-end du '+w.lab+', par jour',w.tous.length?`<div class="grid">${w.tous.map(([c,s])=>fig(c,s)).join('')}</div>`:empty('Pas d\'affiche pour ce week-end.'));
  if(v==='stades'){
    h=Object.entries(STADES).map(([k,[nom,ville]])=>{const it=w.stades.filter(x=>x[0]===k);
      return sec(nom,ville+' · week-end du '+w.lab,it.length?`<div class="grid">${it.map(([,c,s])=>fig(nom+' · '+c,s)).join('')}</div>`:empty('Pas de match de Sèvres à domicile ici ce week-end.'));}).join('');
  }
  if(v==='categories') h=sec('Par catégorie','Week-end du '+w.lab,w.cat.length?`<div class="grid">${w.cat.map(([c,s])=>fig(c,s)).join('')}</div>`:empty('Pas d\'affiche par catégorie pour ce week-end.'));
  if(v==='amical') h=sec('Match amical à trouver','Nos équipes sans match officiel et les créneaux libres sur nos stades. Clubs intéressés, contactez le Sèvres F.C. 92.',w.amical.length?`<div class="grid">${w.amical.map(([c,s])=>fig(c,s)).join('')}</div>`:empty('Toutes nos équipes ont un match officiel ce week-end.'));
  document.getElementById('content').innerHTML=h;
}
const lb=document.getElementById('lb');
function show(i){idx=(i+list.length)%list.length;const [c,s]=list[idx];
  const im=document.getElementById('lb-img');im.src=s;im.alt='Affiche '+c;
  document.getElementById('lb-cap').textContent=c;document.getElementById('lb-open').href=s;lb.hidden=false;}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(e.target===lb){lb.hidden=true;return;}
  if(!b)return;
  if(b.dataset.w){week=b.dataset.w;render();}
  else if(b.dataset.i){show(+b.dataset.i);}
  else if(b.id==='lb-close')lb.hidden=true;
  else if(b.id==='lb-prev')show(idx-1);
  else if(b.id==='lb-next')show(idx+1);
});
document.addEventListener('keydown',e=>{if(lb.hidden)return;
  if(e.key==='Escape')lb.hidden=true;if(e.key==='ArrowLeft')show(idx-1);if(e.key==='ArrowRight')show(idx+1);});
addEventListener('hashchange',()=>{render();scrollTo(0,0);});
render();
</script>

</body></html>
